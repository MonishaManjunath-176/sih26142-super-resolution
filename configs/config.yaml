# ============================================================
# SIH26142 - CNN + CBAM Attention Satellite Super-Resolution
# ============================================================

project:
  name: "SIH26142_CNN_Attention_SuperResolution"
  upscale_factor: 4
  description: >
    CNN + CBAM Attention hybrid network for 4x multispectral
    satellite image super-resolution.

data:
  in_channels: 4
  out_channels: 4

  # Full local SEN2NAIPv2 cross-sensor dataset
  local_dataset_root: "data/sen2naipv2_extracted"

  # Dataset dimensions
  lr_size: 130
  hr_size: 520

model:
  generator:
    name: "CNNAttentionGenerator"
    base_features: 64
    num_res_blocks: 4
    attention_reduction: 8

training:
  # RTX 3050 Ti 4 GB
  batch_size: 1

  # Full-dataset training
  epochs: 30

  lr_g: 0.0002

  beta1: 0.9
  beta2: 0.999

  # Loss = L1 + spectral consistency
  lambda_l1: 1.0
  lambda_spectral: 0.1

  amp: true
  device: "cuda"

  checkpoint_dir: "outputs/checkpoints"
  save_every: 1

evaluation:
  metrics:
    - "PSNR"
    - "SSIM"
    - "SAM"

inference:
  checkpoint: "outputs/checkpoints/best_generator.pth"